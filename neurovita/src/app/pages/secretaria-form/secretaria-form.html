@if (edicao() && !existente()) {
  <div class="pg">
    <app-titulo-pagina titulo="Secretária não encontrada" subtitulo="Esse cadastro não existe ou foi removido." [voltarPara]="voltar()" />
  </div>
} @else {
  <div class="pg">
    <app-titulo-pagina
      [titulo]="edicao() ? 'Editar Cadastro' : 'Cadastrar Nova Secretária'"
      subtitulo="Preencha as informações para realizar o cadastro da secretária"
      [voltarPara]="voltar()"
    />

    <form class="cartao form-pac" novalidate (submit)="$event.preventDefault(); cadastrar()">
      <div class="form-pac-grade">
        <section class="form-pac-bloco" aria-labelledby="s-dados">
          <h2 id="s-dados" class="form-pac-titulo"><app-icone nome="usuario" /> Dados Pessoais</h2>
          <div class="form-pac-campos form-pac-campos-10">
            <label class="campo-form campo-cheio" [class.campo-form-erro]="mostrarErro('nome')">
              <span class="campo-rotulo">Nome completo *</span>
              <input type="text" placeholder="Digite o nome completo" autocomplete="off" [value]="f().nome" (input)="digitar('nome', $event)" [attr.aria-invalid]="!!mostrarErro('nome')" />
              @if (mostrarErro('nome'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
            </label>
            <label class="campo-form" [class.campo-form-erro]="mostrarErro('nascimento')">
              <span class="campo-rotulo">Data de Nascimento*</span>
              <input type="text" inputmode="numeric" placeholder="DD/MM/AAAA" autocomplete="off" [value]="f().nascimento" (input)="digitar('nascimento', $event)" [attr.aria-invalid]="!!mostrarErro('nascimento')" />
              @if (mostrarErro('nascimento'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
            </label>
            <label class="campo-form" [class.campo-form-erro]="mostrarErro('cpf')">
              <span class="campo-rotulo">CPF*</span>
              <input type="text" inputmode="numeric" placeholder="000.000.000-00" autocomplete="off" [value]="f().cpf" (input)="digitar('cpf', $event)" [attr.aria-invalid]="!!mostrarErro('cpf')" />
              @if (mostrarErro('cpf'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
            </label>
            <label class="campo-form" [class.campo-form-erro]="mostrarErro('telefone')">
              <span class="campo-rotulo">Telefone</span>
              <input type="tel" inputmode="tel" placeholder="(61) 99999-9999" autocomplete="off" [value]="f().telefone" (input)="digitar('telefone', $event)" [attr.aria-invalid]="!!mostrarErro('telefone')" />
              @if (mostrarErro('telefone'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
            </label>
            <label class="campo-form" [class.campo-form-erro]="mostrarErro('cidade')">
              <span class="campo-rotulo">Cidade*</span>
              <input type="text" placeholder="Brasília" autocomplete="off" [value]="f().cidade" (input)="digitar('cidade', $event)" [attr.aria-invalid]="!!mostrarErro('cidade')" />
              @if (mostrarErro('cidade'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
            </label>
            <label class="campo-form" [class.campo-form-erro]="mostrarErro('cep')">
              <span class="campo-rotulo">CEP*</span>
              <input type="text" inputmode="numeric" placeholder="00000-000" autocomplete="off" [value]="f().cep" (input)="digitar('cep', $event)" [attr.aria-invalid]="!!mostrarErro('cep')" />
              @if (mostrarErro('cep'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
            </label>
            <label class="campo-form">
              <span class="campo-rotulo">Bairro</span>
              <input type="text" placeholder="Santa Maria" autocomplete="off" [value]="f().bairro" (input)="digitar('bairro', $event)" />
            </label>
            <label class="campo-form campo-larg-8">
              <span class="campo-rotulo">Endereço</span>
              <input type="text" placeholder="Digite o endereço completo" autocomplete="off" [value]="f().endereco" (input)="digitar('endereco', $event)" />
            </label>
            <label class="campo-form campo-larg-2">
              <span class="campo-rotulo">Numero</span>
              <input type="text" placeholder="00" autocomplete="off" [value]="f().numero" (input)="digitar('numero', $event)" />
            </label>
            <label class="campo-form campo-cheio">
              <span class="campo-rotulo">Complemento</span>
              <input type="text" placeholder="Setor Meireles - Total ville" autocomplete="off" [value]="f().complemento" (input)="digitar('complemento', $event)" />
            </label>
          </div>
        </section>

        <div class="form-pac-coluna">
          <section class="form-pac-bloco" aria-labelledby="s-prof">
            <h2 id="s-prof" class="form-pac-titulo form-pac-titulo-centro">Dados Profissionais</h2>
            <label class="campo-form" [class.campo-form-erro]="mostrarErro('cargo')">
              <span class="campo-rotulo">Cargo*</span>
              <input type="text" placeholder="Secretária" autocomplete="off" [value]="f().cargo" (input)="digitar('cargo', $event)" [attr.aria-invalid]="!!mostrarErro('cargo')" />
              @if (mostrarErro('cargo'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
            </label>
            <label class="campo-form campo-meia" [class.campo-form-erro]="mostrarErro('admissao')">
              <span class="campo-rotulo">Data de contratação</span>
              <input type="text" inputmode="numeric" placeholder="DD/MM/AAAA" autocomplete="off" [value]="f().admissao" (input)="digitar('admissao', $event)" [attr.aria-invalid]="!!mostrarErro('admissao')" />
              @if (mostrarErro('admissao'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
            </label>
          </section>

          <section class="form-pac-bloco" aria-labelledby="s-acesso">
            <h2 id="s-acesso" class="form-pac-titulo"><app-icone nome="escudo" /> Acesso ao sistema</h2>
            <label class="campo-form" [class.campo-form-erro]="mostrarErro('emailAcesso')">
              <span class="campo-rotulo">Usuario*</span>
              <input type="email" placeholder="usuario@email.com" autocomplete="off" [value]="f().emailAcesso" (input)="digitar('emailAcesso', $event)" [attr.aria-invalid]="!!mostrarErro('emailAcesso')" />
              @if (mostrarErro('emailAcesso'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
            </label>
            <div class="senha-linha">
              <label class="campo-form" [class.campo-form-erro]="mostrarErro('senha')">
                <span class="campo-rotulo">{{ edicao() ? 'Senha' : 'Senha*' }}</span>
                <input type="text" [placeholder]="edicao() ? 'Nova senha (opcional)' : 'Digite ou gere uma senha'" autocomplete="off" [value]="f().senha" (input)="digitar('senha', $event)" [attr.aria-invalid]="!!mostrarErro('senha')" />
                @if (mostrarErro('senha'); as m) { <small class="campo-msg" role="alert">{{ m }}</small> }
              </label>
              <button type="button" class="botao-escuro botao-com-icone senha-gerar" (click)="gerarSenha()"><app-icone nome="atualizar" /> Gerar senha</button>
            </div>
            <label class="check"><input type="checkbox" [checked]="f().boasVindas" (change)="definir('boasVindas', !f().boasVindas)" /><span class="caixa"></span> Enviar e-mail de boas vindas com as instruções de acesso</label>
            @if (edicao()) {
              <div class="radios-seg radios-seg-direita" role="radiogroup" aria-label="Status da secretária">
                <label class="radio"><input type="radio" name="status" [checked]="f().ativo" (change)="definir('ativo', true)" /><span class="radio-bolinha"></span> Ativo</label>
                <label class="radio"><input type="radio" name="status" [checked]="!f().ativo" (change)="definir('ativo', false)" /><span class="radio-bolinha"></span> Inativo</label>
              </div>
            }
          </section>
        </div>
      </div>

      <div class="form-pac-botoes">
        <button type="button" class="botao-claro" (click)="cancelar()">Cancelar</button>
        <button type="submit" class="botao-escuro">{{ edicao() ? 'Salvar' : 'Cadastrar' }}</button>
      </div>
    </form>
  </div>

  <app-dialogo
    [aberto]="confirmando()" [titulo]="edicao() ? 'Salvar alterações?' : 'Confirmar Cadastro?'" textoConfirmar="Salvar"
    (cancelar)="confirmando.set(false)" (confirmar)="confirmar()"
  />
}
